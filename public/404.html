<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#11100e" />
    <title>Qinisile Gracious Mkhonto | Under Construction</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: clamp(1.5rem, 5vw, 4rem);
        place-items: center;
        color: #f1ede4;
        background: #11100e;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(100%, 56rem);
        padding: clamp(2rem, 7vw, 6rem);
        border: 1px solid rgba(224, 210, 181, 0.18);
      }
      p:first-child {
        margin: 0 0 1.5rem;
        color: #c5a367;
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(3rem, 9vw, 7rem);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: .9;
      }
      p:last-child {
        max-width: 38rem;
        margin: 2rem 0 0;
        color: rgba(241, 237, 228, .68);
        font-size: 1.05rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Qinisile Gracious Mkhonto</p>
      <h1>Portfolio under construction.</h1>
      <p>The requested material is no longer publicly available.</p>
    </main>
  </body>
</html>
